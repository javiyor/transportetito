services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      ttnet:
        ipv4_address: 172.28.0.12
    extra_hosts:
      - "nginx:172.28.0.10"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./laravel:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ttnet:
        ipv4_address: 172.28.0.10
    extra_hosts:
      - "app:172.28.0.11"

  app:
    build:
      context: ./infra/php
    restart: unless-stopped
    mem_limit: 512m
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      ttnet:
        ipv4_address: 172.28.0.11
    extra_hosts:
      - "redis:172.28.0.2"
      - "postgres:172.28.0.3"
      - "minio:172.28.0.4"

  node:
    image: node:20-alpine
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    command: ["sh", "-lc", "npm install && npm run build"]
    networks:
      ttnet:
        ipv4_address: 172.28.0.15

  queue:
    build:
      context: ./infra/php
    restart: unless-stopped
    mem_limit: 256m
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    networks:
      ttnet:
        ipv4_address: 172.28.0.13
    extra_hosts:
      - "redis:172.28.0.2"
      - "postgres:172.28.0.3"
      - "minio:172.28.0.4"

  scheduler:
    build:
      context: ./infra/php
    restart: unless-stopped
    mem_limit: 128m
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - app
      - postgres
      - redis
    networks:
      ttnet:
        ipv4_address: 172.28.0.14
    extra_hosts:
      - "redis:172.28.0.2"
      - "postgres:172.28.0.3"
      - "minio:172.28.0.4"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-transportetito}
      POSTGRES_USER: ${DB_USERNAME:-transportetito}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transportetito}
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      ttnet:
        ipv4_address: 172.28.0.3

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    networks:
      ttnet:
        ipv4_address: 172.28.0.16
    extra_hosts:
      - "postgres:172.28.0.3"

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    ports:
      - "63790:6379"
    networks:
      ttnet:
        ipv4_address: 172.28.0.2

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      ttnet:
        ipv4_address: 172.28.0.4

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  ttnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
